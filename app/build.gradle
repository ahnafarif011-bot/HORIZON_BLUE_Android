package com.horizonblue.app;

import android.Manifest;
import android.os.Bundle;
import android.os.Build;
import android.content.pm.PackageManager;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.GeolocationPermissions;
import android.webkit.JavascriptInterface;
import android.widget.Toast;

import androidx.fragment.app.FragmentActivity;
import androidx.biometric.BiometricPrompt;
import androidx.biometric.BiometricManager;
import androidx.core.content.ContextCompat;

import java.util.concurrent.Executor;

public class MainActivity extends FragmentActivity {

    private WebView webView;
    private GeolocationPermissions.Callback geoCallback;
    private String geoOrigin;
    private static final int LOCATION_REQUEST = 101;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);
        setContentView(webView);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setGeolocationEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(false);
        settings.setSupportZoom(false);

        webView.addJavascriptInterface(
            new BiometricBridge(), "HorizonBiometric"
        );

        webView.setWebViewClient(new WebViewClient());

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onGeolocationPermissionsShowPrompt(
                String origin,
                GeolocationPermissions.Callback callback
            ) {
                geoOrigin = origin;
                geoCallback = callback;

                if (hasLocationPermission()) {
                    callback.invoke(origin, true, false);
                    geoCallback = null;
                    geoOrigin = null;
                } else {
                    requestLocation();
                }
            }
        });

        webView.loadUrl("file:///android_asset/index.html");
    }

    private class BiometricBridge {

        @JavascriptInterface
        public void authenticate() {
            runOnUiThread(() -> startBiometric());
        }
    }

    private void startBiometric() {

        BiometricManager manager =
            BiometricManager.from(this);

        int result = manager.canAuthenticate(
            BiometricManager.Authenticators.BIOMETRIC_WEAK
        );

        if (result != BiometricManager.BIOMETRIC_SUCCESS) {
            sendResult(false,
                "No supported biometric is available.");
            return;
        }

        Executor executor =
            ContextCompat.getMainExecutor(this);

        BiometricPrompt prompt = new BiometricPrompt(
            this,
            executor,
            new BiometricPrompt.AuthenticationCallback() {

                @Override
                public void onAuthenticationSucceeded(
                    BiometricPrompt.AuthenticationResult result
                ) {
                    sendResult(true, "Verified");
                }

                @Override
                public void onAuthenticationError(
                    int errorCode, CharSequence errString
                ) {
                    sendResult(false, errString.toString());
                }
            }
        );

        BiometricPrompt.PromptInfo info =
            new BiometricPrompt.PromptInfo.Builder()
                .setTitle("HORIZON BLUE")
                .setSubtitle("Verify your identity")
                .setDescription(
                    "Use your fingerprint or supported biometric"
                )
                .setAllowedAuthenticators(
                    BiometricManager.Authenticators.BIOMETRIC_WEAK
                )
                .setNegativeButtonText("Cancel")
                .build();

        prompt.authenticate(info);
    }

    private void sendResult(boolean success, String message) {
        if (webView == null) return;

        String safeMessage =
            org.json.JSONObject.quote(message);

        String script =
            "window.onBiometricResult(" +
            success + "," + safeMessage + ");";

        runOnUiThread(() ->
            webView.evaluateJavascript(script, null)
        );
    }

    private boolean hasLocationPermission() {
        if (Build.VERSION.SDK_INT >= 23) {
            return checkSelfPermission(
                Manifest.permission.ACCESS_FINE_LOCATION
            ) == PackageManager.PERMISSION_GRANTED
            || checkSelfPermission(
                Manifest.permission.ACCESS_COARSE_LOCATION
            ) == PackageManager.PERMISSION_GRANTED;
        }
        return true;
    }

    private void requestLocation() {
        if (Build.VERSION.SDK_INT >= 23) {
            requestPermissions(
                new String[] {
                    Manifest.permission.ACCESS_FINE_LOCATION,
                    Manifest.permission.ACCESS_COARSE_LOCATION
                },
                LOCATION_REQUEST
            );
        }
    }

    @Override
    public void onRequestPermissionsResult(
        int requestCode,
        String[] permissions,
        int[] grantResults
    ) {
        super.onRequestPermissionsResult(
            requestCode, permissions, grantResults
        );

        if (requestCode == LOCATION_REQUEST) {
            boolean granted = false;

            for (int result : grantResults) {
                if (result == PackageManager.PERMISSION_GRANTED) {
                    granted = true;
                    break;
                }
            }

            if (geoCallback != null) {
                geoCallback.invoke(geoOrigin, granted, false);
                geoCallback = null;
                geoOrigin = null;
            }

            if (!granted) {
                Toast.makeText(
                    this,
                    "Location permission denied",
                    Toast.LENGTH_SHORT
                ).show();
            }
        }
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }

    @Override
    protected void onDestroy() {
        if (webView != null) {
            webView.destroy();
            webView = null;
        }
        super.onDestroy();
    }
}
dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}
